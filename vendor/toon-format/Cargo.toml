[package]
name = "toon-format"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "TOON 3.0 codec with isolated jless compatibility backports"

[features]
default = []
layout = []
json_stream = []
cli = []

[dependencies]
indexmap = "=2.2.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
thiserror = "=2.0.17"
