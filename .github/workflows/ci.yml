name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install toolchains and check tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev shellcheck
          npm install --global @fission-ai/openspec@1.11.0
          cargo install okf --version 0.2.7 --locked
          GOBIN="$HOME/.local/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?!?: .+'
          [[ "$PR_TITLE" =~ $pattern ]] || { echo 'Use a Conventional Commit PR title.' >&2; exit 1; }
      - name: Local preflight
        env:
          OPENSPEC_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          OPENSPEC_PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/preflight.sh
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install documentation validator
        run: cargo install okf --version 0.2.7 --locked
      - name: Validate documentation
        run: okf validate docs/
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: 1.87.0
          - os: macos-15
            toolchain: 1.97.1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install compiler
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - name: Install Linux clipboard dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Feature compatibility
        env:
          TLESS_TOOLCHAIN: ${{ matrix.toolchain }}
        run: scripts/preflight.sh test
  required:
    if: always()
    needs: [preflight, docs, compatibility]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          DOCS: ${{ needs.docs.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
        run: test "$PREFLIGHT" = success && test "$DOCS" = success && test "$COMPATIBILITY" = success
