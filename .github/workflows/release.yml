name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install check tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev shellcheck
          cargo install okf --version 0.2.7 --locked
          GOBIN="$HOME/.local/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check reviewed source and release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release.sh check "$RELEASE_TAG"
      - run: scripts/preflight.sh
      - name: Check minimum compiler
        run: |
          rustup toolchain install 1.87.0 --profile minimal
          TLESS_TOOLCHAIN=1.87.0 scripts/preflight.sh test
  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install Linux clipboard dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Native behavior tests and extracted binary checks
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          scripts/preflight.sh test
          scripts/release.sh package "$RELEASE_TARGET"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Verify complete release and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          scripts/release.sh verify-assets dist
          scripts/release.sh notes > "$RUNNER_TEMP/release-notes.md"
          args=(--draft --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then args+=(--prerelease); fi
          # Creation fails if a release already exists. Never replace published bytes.
          gh release create "$RELEASE_TAG" "${args[@]}" dist/*
