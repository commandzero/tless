[package]
name = "tless"
version = "0.1.1"
authors = ["Ryan Eno <cargo@commandzero.com>", "Paul Julius Martinez <pauljuliusmartinez@gmail.com>"]
license = "MIT"
description = "A terminal viewer for JSON, YAML, and TOON"
keywords = ["cli", "json", "yaml", "toon"]
categories = ["command-line-utilities"]
repository = "https://github.com/CommandZero/tless"
homepage = "https://github.com/CommandZero/tless"
documentation = "https://github.com/CommandZero/tless#readme"
publish = true
edition = "2024"
rust-version = "1.87"

[package.metadata.toon]
spec = "3.0"
codec = "toon-format 0.5.0 from crates.io"

[features]
default = ["colorscheme"]
colorscheme = []
sexp = []

[dependencies]
logos = "0.16.1"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
rustyline = { version = "18.0.1", default-features = false }
regex = "1.13.1"
lazy_static = "1.5.0"
termion = "4.0.6"
signal-hook = "0.4.4"
nix = { version = "0.31.3", default-features = false, features = ["fs", "poll", "event", "signal"] }
clap = { version = "4.6.6", features = ["derive"] }
yaml-rust = "0.4.5"
arboard = { version = "3.6.1", default-features = false }
toon-format = { version = "=0.5.0", default-features = false }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[dev-dependencies]
libc = "0.2"
nix = { version = "0.31.3", default-features = false, features = ["resource"] }
indoc = "2.0.7"
