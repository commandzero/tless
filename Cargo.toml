[package]
name = "tless"
version = "0.1.0"
authors = ["Paul Julius Martinez <pauljuliusmartinez@gmail.com>"]
license = "MIT"
description = "A terminal viewer for JSON, YAML, and TOON"
keywords = ["cli", "json", "yaml", "toon"]
categories = ["command-line-utilities"]
repository = "https://github.com/CommandZero/tless"
homepage = "https://github.com/CommandZero/tless"
documentation = "https://github.com/CommandZero/tless#readme"
publish = false
edition = "2024"
rust-version = "1.87"

[package.metadata.toon]
spec = "3.0"
feature = "toon"
codec = "toon-format 0.5.0 from crates.io"

[features]
default = ["toon", "colorscheme"]
colorscheme = []
sexp = []
toon = ["dep:toon-format", "dep:serde_json"]

[dependencies]
logos = "0.16.1"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
rustyline = { version = "18.0.1", default-features = false }
regex = "1.13.1"
lazy_static = "1.5.0"
termion = "4.0.6"
signal-hook = "0.4.4"
libc = "0.2"
clap = { version = "4.6.6", features = ["derive"] }
libc-stdhandle = "0.1.0"
yaml-rust = "0.4.5"
arboard = { version = "3.6.1", default-features = false }
toon-format = { version = "=0.5.0", default-features = false, optional = true }
serde_json = { version = "=1.0.151", features = ["preserve_order"], optional = true }

[dev-dependencies]
indoc = "2.0.7"
