[package]
name = "tless"
version = "0.10.0"
authors = ["Paul Julius Martinez <pauljuliusmartinez@gmail.com>"]
license = "MIT"
description = "A terminal viewer for JSON, YAML, and TOON"
keywords = ["cli", "json"]
categories = ["command-line-utilities"]
repository = "https://github.com/CommandZero/tless"
homepage = "https://github.com/CommandZero/tless"
documentation = "https://github.com/CommandZero/tless#readme"
publish = false
edition = "2018"
rust-version = "1.67"

[package.metadata.toon]
spec = "3.0"
feature = "toon"
codec = "toon-format 0.5.0 with local compatibility backports"

[features]
default = ["toon"]
sexp = []
toon = ["dep:toon-format", "dep:serde_json"]

[dependencies]
logos = "0.12.0"
unicode-width = "0.1.5"
unicode-segmentation = "1.7.1"
rustyline = "9.0.0"
regex = "1.5"
lazy_static = "1.4.0"
termion = "1.5.6"
signal-hook = "0.3.8"
libc = "0.2"
clap = { version = "4.0", features = ["derive"] }
isatty = "0.1"
libc-stdhandle = "0.1.0"
yaml-rust = "0.4"
clipboard = "0.5"
toon-format = { version = "=0.5.0", default-features = false, optional = true }
serde_json = { version = "=1.0.145", features = ["preserve_order"], optional = true }

[patch.crates-io]
toon-format = { path = "vendor/toon-format" }

[dev-dependencies]
indoc = "1.0"
